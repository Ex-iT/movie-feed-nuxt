name: ci

on:
  push:
    branches:
      - main
      - nuxt-vue-migration
  pull_request:
    branches:
      - main
      - nuxt-vue-migration

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout 🛎
        uses: actions/checkout@v4

      - name: Install pnpm env 🏗
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Install Node.js 🏗
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies 👨🏻‍💻
        run: pnpm install

      - name: Run linter 👀
        run: pnpm run lint
